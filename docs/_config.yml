# GitHub Pages, served from /docs on the default branch.
#
# No theme. Jekyll is here for one job — rendering the guide's markdown, which it does correctly and
# which this repository has no local renderer for — and every pixel comes from _layouts/default.html
# and assets/site.css instead of a theme's opinions.
title: Burxt
description: A typed, compiled, native language where exact decimals are the default.
# The custom domain. `docs/CNAME` holds the bare hostname, and it is COMMITTED rather than left to
# GitHub's settings page to write — GitHub does create it when a custom domain is set, but a branch
# change or a rebuild can drop it, and the failure looks like DNS rather than a missing file.
#
# `baseurl` is empty because the site is at the root of its own domain. Every internal link goes
# through `{{ site.baseurl }}`, so it stays correct either way and moving the site again is two
# lines here.
url: https://burxt-lang.org
baseurl: ""

# The milestone log and the specs are for people reading the repository, not visitors to the site.
# They stay in git and out of the build rather than being half-styled pages nobody links to.
exclude:
  - log
  - README.md

# Every page in guide/ gets the same layout without twelve copies of the same front matter.
#
# `doc` is the layout with the sidebar: a left rail of every topic and its steps, the page, and an
# "on this page" list. Guide and reference pages use it; the landing page, the refusals gallery and
# the install page do not, because a sidebar of somewhere else's contents is furniture.
defaults:
  - scope:
      path: "guide"
    values:
      layout: doc
      section: guide
  - scope:
      path: "reference"
    values:
      layout: doc
      section: reference
  - scope:
      path: ""
    values:
      layout: default

# Ordinary code fences, highlighted by rouge. `burxt` is not a language rouge knows, so those blocks
# come out as a plain `<pre><code class="language-burxt">` rather than wrongly highlighted — which is
# the better failure, and it is what `assets/burxt-editor.js` then enhances in the browser: gutter,
# colour, and a squiggle wherever the page shows the compiler refusing something.
#
# This comment used to claim "the site does its own colouring for them" while no highlighter existed
# anywhere in docs/. It described an intention as a feature for long enough that the first person to
# look at the site said the code blocks had no colours at all. The colouring happens at RUNTIME and
# the fences stay untouched, which is deliberate: `the_guide_code_compiles` compiles every one of
# them, so a snippet on this site cannot drift from what the compiler does.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
