# Every push runs the whole suite, including the byte-identical fixpoint.
#
# The README says "a test runs the chain on every commit". Until v0.0.124 that was not true —
# there was no CI at all — and a document that lies is the rot this project spends versions
# removing. This is the file that makes the sentence honest.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Job-wide, so `build` and `test` compile with the SAME flags and share one cache entry. Setting
  # it on the build step alone made cargo rebuild everything for the test step.
  RUSTFLAGS: -D warnings
  # `.cargo/config.toml` already sets LLVM_SYS_181_PREFIX to /usr/lib/llvm-18, which is exactly
  # where apt.llvm.org installs it — so the checkout carries its own build configuration and this
  # workflow does not have to know about it.

jobs:
  suite:
    name: Build and run every invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LLVM **18**, pinned. inkwell is on feature `llvm18-1`, so a floating LLVM is how this
      # breaks silently in six months: a newer one would fail to link against a feature-gated
      # crate, and the failure would look like the compiler's fault rather than the runner's.
      #
      # `llvm-18-dev` is what provides llvm-config and the static libraries the build links; the
      # binary alone is not enough. `tests/runner.rs` also invokes /usr/lib/llvm-18/bin/llc by
      # absolute path to assemble stage-1's textual IR, and skips those tests when it is absent —
      # so without this step the suite would pass while silently testing less.
      - name: Install LLVM 18
        run: |
          # Into /tmp, NOT the workspace. Downloading it beside the checkout left `llvm.sh` in the
          # repository root, and two tests correctly refused it — `the_repository_root_holds_only
          # _what_belongs_there` and `every_source_and_document_is_in_version_control`. The tests
          # were right and this workflow was the thing littering.
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y llvm-18 llvm-18-dev libpolly-18-dev
          /usr/lib/llvm-18/bin/llc --version | head -2
          test -x /usr/lib/llvm-18/bin/llc

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm18-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-llvm18-

      # Warnings are errors in CI. The tree is at zero warnings, and the cheapest moment to keep
      # it there is the one where nobody has to remember to look.
      #
      # NOTE, learned from the first run of this workflow, which failed: `cargo build` does not
      # compile the TEST target, so `-D warnings` never reaches tests/runner.rs during a build.
      # A stray `mut` sat in that file through 130 versions because no local command ever saw it.
      # `cargo test` below compiles it, which is where it surfaced. To reproduce this job locally:
      #
      #     RUSTFLAGS="-D warnings" cargo test --locked --no-run
      - name: Build
        run: cargo build --locked --verbose

      # `/usr/bin/time -v` is how the Burxt runner measures peak RSS — `getrusage` fills a struct
      # through a pointer, which the memory model does not allow, and it turns out not to be needed.
      # The shell BUILTIN `time` is a different thing and will not do; this is the coreutils-adjacent
      # `time` package, which ubuntu-latest does not always carry.
      - name: Install the time utility
        run: sudo apt-get install -y time

      # THE SUITE, RUN BY BURXT — and it runs FIRST, because that ordering is the point.
      #
      # Andre: *"runner.rs main runner should be bx, we should eventually get rid of rust — not
      # delete, but don't use as main. We are BURXT!"* The authority on whether Burxt works was a
      # Rust program, and the same rule that governs the compiler governs the suite: Rust may BUILD
      # Burxt, Burxt may not USE Rust. So a contributor sees the Burxt runner's verdict before the
      # Rust one's, and `runner.rs` becomes the cross-check.
      #
      # It exits nonzero on failure — verified by planting a broken fixture, because it printed
      # `SUITE FAILED` and exited 0 for its whole life until v0.0.227, which is the one failure mode
      # a runner must not have. The `grep` is belt-and-braces rather than load-bearing.
      - name: Run the suite on Burxt
        run: |
          ./target/debug/burxt build tests/runner.bx -o /tmp/burxt-runner
          /tmp/burxt-runner "$(realpath ./target/debug/burxt)" /tmp/burxt-suite-work | tee /tmp/suite.log
          grep -qx 'all green' /tmp/suite.log

      # And the check that LICENSES the step above. A runner that walked all 447 fixtures and
      # compared nothing would print `ran 447, passed 447, failed 0` and be perfectly green — the
      # oldest failure shape in this project, and the reason `tests/pass` fixtures cannot tell
      # "supported" from "not examined". So this breaks exactly one thing a fixture asserts, in a
      # scratch copy of the tree, and requires the runner to NAME that fixture. Mutation is the only
      # instrument that can tell "checked and correct" from "not checked".
      - name: The Burxt runner examines what it claims to
        run: |
          ./target/debug/burxt build tests/support/runner_agreement.bx -o /tmp/burxt-agreement
          /tmp/burxt-agreement /tmp/burxt-runner "$(realpath ./target/debug/burxt)" /tmp/agreement-work

      # The Rust suite, now the CROSS-CHECK rather than the authority. All of them, and the list is
      # the point: the byte-identical self-hosting fixpoint, the differential test between the two
      # compilers, every pass fixture compiled by BOTH and compared byte for byte, the refusal
      # EQUALITY, the performance ratios, the editor grammar, the packaged extension, the guide's
      # links and keyword currency, and the naming rule.
      #
      # `BURXT_VERDICTS=1` makes the three fixture sweeps print one TAP-style line per fixture, so
      # the two runners' verdicts are comparable name by name. Without it a green Rust run emits
      # nothing per fixture, and two runners that both examine nothing agree perfectly.
      - name: Run the suite on Rust, as the cross-check
        run: BURXT_VERDICTS=1 cargo test --locked -- --nocapture

      # A cheap end-to-end check that the thing a user actually types works. `print("...");` with
      # no wrapper is a whole Burxt program — no entry point to declare — and if that ever stops
      # being true the landing page is wrong.
      - name: A one-line program is a whole program
        run: |
          printf 'print("Hello, world!");\n' > /tmp/hello.bx
          # From /tmp, because `burxt run` writes the executable it builds into the working
          # directory — and a stray binary in the repository root is a thing the suite refuses.
          cd /tmp && "$GITHUB_WORKSPACE/target/debug/burxt" run hello.bx | tee out
          grep -qx 'Hello, world!' /tmp/out
